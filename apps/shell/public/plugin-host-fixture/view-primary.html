<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Exo fixture primary panel</title>
    <style>
      body {
        font:
          13px system-ui,
          sans-serif;
        margin: 0;
        padding: 12px;
      }
      button {
        display: block;
        width: 100%;
        margin: 0 0 6px;
        padding: 6px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Fixture Panel</h1>
    <button id="publish" type="button">Publish local event</button>
    <button id="subscribe-theme" type="button">Subscribe theme</button>
    <button id="open-file" type="button">Open /notes.txt</button>
    <button id="toggle-secondary" type="button">Toggle secondary panel</button>
    <button id="open-content" type="button">Open fixture content view</button>
    <button id="open-other" type="button">Open other plugin view</button>
    <button id="open-oversized" type="button">Open oversized view</button>
    <pre id="observation">starting</pre>
    <script src="view-common.js"></script>
  </body>
</html>

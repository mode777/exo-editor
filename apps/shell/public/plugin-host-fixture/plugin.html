<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Exo fixture controller</title>
  </head>
  <body>
    <pre id="observation">starting</pre>
    <script>
      const params = new URLSearchParams(location.hash.slice(1))
      const host = params.get('exo-host')
      const mode = params.get('exo-mode')
      const sessionId = params.get('exo-session')
      let storage = 'unavailable'
      try {
        localStorage.setItem('exo-fixture', '1')
        localStorage.removeItem('exo-fixture')
        storage = 'available'
      } catch {
        storage = 'unavailable'
      }
      const observation = {
        mode,
        origin: location.origin,
        storage,
        hidden: document.visibilityState,
      }
      document.getElementById('observation').textContent = JSON.stringify(observation)
      document.title = `Exo fixture ${mode} ${storage}`

      window.addEventListener('message', (event) => {
        if (!host) return
        if (event.source !== parent) return
        // A same-origin sandboxed frame reports "null"; a cross-origin frame
        // reports the shell origin it was told to post to.
        if (event.origin !== host && event.origin !== 'null') return
        const data = event.data
        if (!data || data.exo !== 1 || data.type !== 'shell/init') return
        if (mode !== 'register') return
        setTimeout(() => {
          parent.postMessage(
            {
              exo: 1,
              type: 'plugin/register',
              payload: {
                fileEditors: [
                  { glob: '**/*.events.txt', entry: 'editor-events.html' },
                  { glob: '**/*.repeat.txt', entry: 'editor-repeat.html' },
                  { glob: '**/*.append.txt', entry: 'editor-append.html' },
                  { glob: '**/*.neverack.txt', entry: 'editor-never-ack.html' },
                  { glob: '**/*.txt', entry: 'editor.html' },
                  { glob: '**/*.sibling.txt', entry: 'sibling.html' },
                ],
              },
            },
            host,
          )
          parent.postMessage({ exo: 1, type: 'plugin/register-complete', payload: {} }, host)
        }, 600)
      })

      if (host && sessionId) {
        parent.postMessage(
          {
            exo: 1,
            type: 'plugin/ready',
            payload: { protocolVersion: '1', sessionId },
          },
          host,
        )
      }
    </script>
  </body>
</html>

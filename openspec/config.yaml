schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Exo Editor is a frontend-only, serverless editor shell. The shell is the
  product; editors are untrusted cross-origin iframe plugins.
  One roadmap layer equals one change, named exactly as in ROADMAP.md.
  Contracts in docs/contracts/ are normative and mirrored in openspec/specs/;
  change both in the same change, never add an undocumented message, field or
  provider method. No backend, no proxying, no secrets. A workspace switch must
  reset all workspace-scoped plugin state. See AGENTS.md before proposing.

# Example:

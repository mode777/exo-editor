name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node apps/shell/scripts/check-bundle-budget.mjs apps/shell/dist apps/shell/budget.json

      - name: CSP present in deployed document
        run: node apps/shell/scripts/check-dist-csp.mjs apps/shell/dist/index.html

      - name: Custom elements registered in bundle
        run: node apps/shell/scripts/check-dist-elements.mjs apps/shell/dist

      - name: Plugin SDK absent from shell bundle
        run: npm run check:dist-no-sdk

      - name: Monaco absent from shell bundle
        run: npm run check:dist-no-monaco

      - name: Build plugin template
        run: npm run build:template

      - name: Copy plugin template into the site
        run: npm run deploy:copy-template

      - name: Build reference code plugin
        run: npm run build:code
        env:
          EXO_CODE_PLUGIN_BASE_PATH: /exo-editor/code-plugin/

      - name: Copy reference code plugin into the site
        run: npm run deploy:copy-code

      - name: Upload shell build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shell-dist
          path: apps/shell/dist
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download shell build
        uses: actions/download-artifact@v4
        with:
          name: shell-dist
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
